<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Multiplayer Skeleton</title>
    <style>
        html, body { margin: 0; height: 100%; background: #1b1b1b; color: #ddd;
            font-family: system-ui, sans-serif; overflow: hidden; }
        #wrap { display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 12px; }
        #gameCanvas { background: #2b2b2b; border: 1px solid #000; max-width: 100%; height: auto; }
        #hint { font-size: 13px; opacity: 0.7; }
    </style>
</head>
<body>
    <div id="wrap">
        <div id="hint">Drive with <b>WASD</b> or the <b>arrow keys</b>. Open a second tab to see another player.</div>
        <canvas id="gameCanvas" width="1366" height="768"></canvas>
    </div>

    <!-- Socket.IO client, served by the Socket.IO server mounted on the same port. -->
    <script src="/socket.io/socket.io.js"></script>
    <!-- Raw <script> tags, loaded in dependency order — no bundler, no build step.
         Each file declares the globals the next ones use (chaochao's dev mode). -->
    <script src="scripts/utils.js"></script>
    <script src="scripts/game.js"></script>
    <script src="scripts/client.js"></script>
    <script src="scripts/draw.js"></script>
    <script src="scripts/input.js"></script>
</body>
</html>
